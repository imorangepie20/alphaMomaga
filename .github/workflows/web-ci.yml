name: Web CI

on:
  push:
    paths:
      - "web/**"
      - ".github/workflows/web-ci.yml"
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web-ci.yml"

jobs:
  quality:
    name: Web 품질 검사
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: 저장소 checkout
        uses: actions/checkout@v4
      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: 의존성 설치
        run: npm ci
      - name: 린트
        run: npm run lint
      - name: 단위 테스트
        run: npm test
      - name: 빌드
        run: npm run build
      - name: API 경로 진단
        run: |
          pwd
          ls -la ..
          ls -la ../api/package-lock.json
      - name: API 의존성 설치
        run: npm --prefix ../api ci
      - name: API 빌드
        run: npm --prefix ../api run build
      - name: API 기동
        run: PORT=3100 npm --prefix ../api run start > /tmp/alpha-momega-api.log 2>&1 &
      - name: API 준비 확인
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:3100/health/database > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/alpha-momega-api.log
          exit 1
      - name: Chromium 설치
        run: npx playwright install --with-deps chromium
      - name: 비로그인 업무 페이지 접근 차단
        run: npx playwright test e2e/auth-session.spec.ts --workers=1

