name: Web CI

on:
  push:
    paths:
      - "web/**"
      - ".github/workflows/web-ci.yml"
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web-ci.yml"

jobs:
  quality:
    name: Web 품질 검사
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: 저장소 checkout
        uses: actions/checkout@v4
      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: 의존성 설치
        run: npm ci
      - name: 린트
        run: npm run lint
      - name: 빌드
        run: npm run build
      - name: Chromium 설치
        run: npx playwright install --with-deps chromium
      - name: 운영 페이지 브라우저 테스트
        run: npx playwright test e2e/properties-dashboard.spec.ts e2e/operational-pages.spec.ts --workers=1
