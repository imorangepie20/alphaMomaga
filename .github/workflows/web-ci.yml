name: Web CI

on:
  push:
    paths:
      - "web/**"
      - ".github/workflows/web-ci.yml"
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web-ci.yml"

jobs:
  quality:
    name: Web 품질 검사
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: 저장소 checkout
        uses: actions/checkout@v4
      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: 의존성 설치
        run: npm ci
      - name: 린트
        run: npm run lint
      - name: 빌드
        run: npm run build
