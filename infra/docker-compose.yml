services:
  postgres:
    image: postgres:16-alpine
    container_name: property-manager-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-property_manager}
      POSTGRES_USER: ${POSTGRES_USER:-property_manager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-property_manager_dev}
    ports:
      - "5432:5432"
    volumes:
      - property-manager-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  property-manager-postgres-data:
